services:
  mariadb:
    image: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    volumes:
      - wordpress-database:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    container_name: mariadb
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD --silent || exit 1" ]
      start_period: 2s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inception
    restart: "always"

  wordpress:
    image: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    volumes:
      - wordpress-files:/var/www/wordpress
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOSTNAME=${MYSQL_HOSTNAME}
      - WP_ADMIN=${WP_ADMIN}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_PASSWORD=${WP_PASSWORD}
      - WP_EMAIL=${WP_EMAIL}
    container_name: wordpress
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltp | grep php-fpm || exit 1" ]
      start_period: 2s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true


  nginx:
    image: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    volumes:
      - wordpress-files:/var/www/wordpress
    environment:
      - DEBUG=${DEBUG}
    container_name: nginx
    extra_hosts:
      - "seojilee.42.fr:127.0.0.1"
    networks:
      - inception
    depends_on:
      wordpress:
        condition: service_healthy
        restart: true

volumes:
  wordpress-database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/seojilee/data/database
  wordpress-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/seojilee/data/files

## might change later

networks:
  inception:
